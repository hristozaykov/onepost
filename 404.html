<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname;
        if (path === '/terms' || path === '/terms/') {
            window.location.href = '/terms.html';
        } else if (path === '/privacy' || path === '/privacy/') {
            window.location.href = '/privacy.html';
        } else {
            window.location.href = '/';
        }
    </script>
</head>
<body></body>
</html>
