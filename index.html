<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Post</title>
    <meta name="description" content="One Post">
    
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <meta property="og:title" content="One Post">
    <meta property="og:description" content="One Post">
    <meta property="og:image" content="https://onepost.ink/og-image.png">
    <meta property="og:url" content="https://onepost.ink">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="One Post">
    <meta name="twitter:description" content="One Post">
    <meta name="twitter:image" content="https://onepost.ink/og-image.png">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #000000;
            line-height: 1.6;
        }
        .logo {
            width: 100px;
            height: auto;
        }
        .content {
            display: none;
            max-width: 600px;
            padding: 40px 24px;
            margin: 0 auto;
        }
        .content h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .content h2 {
            font-size: 18px;
            margin-top: 32px;
            margin-bottom: 12px;
        }
        .content p, .content li {
            font-size: 15px;
            color: #333333;
        }
        .content ul, .content ol {
            padding-left: 24px;
        }
        .content li {
            margin-bottom: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 32px;
            color: #000000;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img class="logo" id="logo" src="OP logo.svg" alt="One Post">
    
    <div class="content" id="content"></div>
    
    <script>
    // Handle redirect from 404
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    if (redirect) {
        history.replaceState(null, null, redirect);
    }
    
    const path = window.location.pathname;
    
    if (path === '/terms' || path === '/terms/') {
        loadMarkdown('terms.md');
    } else if (path === '/privacy' || path === '/privacy/') {
        loadMarkdown('privacy.md');
    }
    
    async function loadMarkdown(file) {
        try {
            const response = await fetch('/' + file);
            const text = await response.text();
            const html = marked.parse(text);
            
            document.getElementById('logo').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('content').innerHTML = html + '<a class="back-link" href="/">← Back</a>';
        } catch (error) {
            console.error('Error loading markdown:', error);
        }
    }
</script>
</body>
</html>
