<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Post</title>
    <meta name="description" content="One Post">
    
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <meta property="og:title" content="One Post">
    <meta property="og:description" content="One Post">
    <meta property="og:image" content="https://onepost.ink/og-image.png">
    <meta property="og:url" content="https://onepost.ink">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="One Post">
    <meta name="twitter:description" content="One Post">
    <meta name="twitter:image" content="https://onepost.ink/og-image.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Red Hat Text', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        .app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px 15% 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header a {
            display: block;
        }
        .header img {
            width: 40px;
            height: 40px;
            transition: opacity 0.2s;
        }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="/terms">
                <img src="termsicon.png" alt="Terms" style="opacity: 0.3;">
            </a>
            <a href="/">
                <img src="homeicon.png" alt="Home" style="opacity: 1;">
            </a>
            <a href="/privacy">
                <img src="privacyicon.png" alt="Privacy" style="opacity: 0.3;">
            </a>
        </header>
        
        <div class="content">
            <img class="logo" src="OP logo.svg" alt="One Post">
        </div>
    </div>
</body>
</html>
