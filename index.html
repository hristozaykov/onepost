    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Red Hat Text', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        .header {
            padding: 40px 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }
        .header a {
            display: block;
        }
        .header img {
            height: 100px;
            width: auto;
            transition: opacity 0.2s;
        }
        .header .inactive {
            opacity: 0.3;
        }
        .header .inactive:hover {
            opacity: 1;
        }
    </style>
